name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows binary
        run: go build -ldflags="-H windowsgui -s -w" -o probedesk.exe .

      - name: Package release archive
        shell: pwsh
        run: Compress-Archive -Path probedesk.exe, README.md, LICENSE -DestinationPath probedesk_windows_amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            probedesk.exe
            probedesk_windows_amd64.zip

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev xorg-dev \
            libgtk-3-dev

      - name: Build Linux binary
        run: CGO_ENABLED=1 go build -ldflags="-s -w" -o probedesk_linux .

      - name: Package release archive
        run: tar -czf probedesk_linux_amd64.tar.gz probedesk_linux README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            probedesk_linux
            probedesk_linux_amd64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ProbeDesk ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            dist/probedesk.exe
            dist/probedesk_windows_amd64.zip
            dist/probedesk_linux
            dist/probedesk_linux_amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/probedesk
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
