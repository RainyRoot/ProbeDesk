name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows binary
        run: go build -ldflags="-H windowsgui -s -w" -o probedesk.exe .

      - name: Package release archive
        shell: pwsh
        run: Compress-Archive -Path probedesk.exe, README.md, LICENSE -DestinationPath probedesk_windows_amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            probedesk.exe
            probedesk_windows_amd64.zip

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ProbeDesk ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            dist/probedesk.exe
            dist/probedesk_windows_amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
